name: Build and Deploy Benchmark Dashboard

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Measure all stacks
        run: |
          for stack in fastapi express sinatra gin slim rails django nestjs springboot laravel; do
            echo "==> measuring $stack"
            python benchmark/measure.py "$stack"
          done

      - name: Collect aggregate results
        run: python benchmark/collect.py

      - name: Sync dashboard data
        run: python dashboard/sync_data.py

      - name: Assemble static site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp -R dashboard site/dashboard
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
