settings:
  tokenizer: "cl100k_base"
  metrics: ["tokens", "loc", "file_count", "chars"]
  tokenization_strategy: "pure_content_only"
  file_ordering: "alphabetical_stable"

global_exclude:
  - "**/spec/**"
  - "**/test/**"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/.venv/**"
  - "**/dist/**"
  - "**/build/**"

stacks:
  fastapi:
    metadata:
      language: "python"
      category: "api_first"
      framework: "fastapi"
      orm: "sqlalchemy"
    root_path: "./stacks/api-first/fastapi-app"
    handwritten:
      domain:
        - "models/**/*.py"
        - "schemas/**/*.py"
      api:
        - "main.py"
        - "routers/**/*.py"
      persistence:
        - "database.py"
        - "alembic/versions/**/*.py"
    operational_extras:
      config:
        - "requirements.txt"
        - "alembic.ini"
        - "alembic/env.py"
      migrations: []

  rails:
    metadata:
      language: "ruby"
      category: "opinionated"
      framework: "rails"
      orm: "activerecord"
    root_path: "./stacks/opinionated/rails-app"
    handwritten:
      domain:
        - "app/models/**/*.rb"
      api:
        - "app/controllers/**/*.rb"
        - "config/routes.rb"
      persistence:
        - "db/migrate/**/*.rb"
    operational_extras:
      config:
        - "Gemfile"
        - "config/database.yml"
        - "config/application.rb"
      migrations: []

  django:
    metadata:
      language: "python"
      category: "opinionated"
      framework: "django"
      orm: "django_orm"
    root_path: "./stacks/opinionated/django-app"
    handwritten:
      domain:
        - "app/models.py"
        - "app/serializers.py"
      api:
        - "app/views.py"
        - "app/urls.py"
      persistence:
        - "app/migrations/**/*.py"
    operational_extras:
      config:
        - "manage.py"
        - "requirements.txt"
        - "config/settings.py"
        - "config/urls.py"
        - "config/asgi.py"
        - "config/wsgi.py"
      migrations: []

  nestjs:
    metadata:
      language: "typescript"
      category: "opinionated"
      framework: "nestjs"
      orm: "prisma"
    root_path: "./stacks/opinionated/nestjs-app"
    handwritten:
      domain:
        - "prisma/schema.prisma"
        - "src/**/*.dto.ts"
      api:
        - "src/main.ts"
        - "src/app.module.ts"
        - "src/users/**/*.controller.ts"
        - "src/users/**/*.module.ts"
        - "src/users/**/*.service.ts"
        - "src/products/**/*.controller.ts"
        - "src/products/**/*.module.ts"
        - "src/products/**/*.service.ts"
        - "src/orders/**/*.controller.ts"
        - "src/orders/**/*.module.ts"
        - "src/orders/**/*.service.ts"
      persistence:
        - "src/prisma/**/*.ts"
        - "prisma/migrations/**/*"
    operational_extras:
      config:
        - "package.json"
        - "package-lock.json"
        - "tsconfig.json"
      migrations: []

  springboot:
    metadata:
      language: "java"
      category: "opinionated"
      framework: "springboot"
      orm: "spring_data_jpa"
    root_path: "./stacks/opinionated/springboot-app"
    handwritten:
      domain:
        - "src/main/java/com/syntaxtax/benchmark/users/User.java"
        - "src/main/java/com/syntaxtax/benchmark/users/CreateUserRequest.java"
        - "src/main/java/com/syntaxtax/benchmark/products/Product.java"
        - "src/main/java/com/syntaxtax/benchmark/products/CreateProductRequest.java"
        - "src/main/java/com/syntaxtax/benchmark/orders/Order.java"
        - "src/main/java/com/syntaxtax/benchmark/orders/OrderItem.java"
        - "src/main/java/com/syntaxtax/benchmark/orders/dto/**/*.java"
      api:
        - "src/main/java/com/syntaxtax/benchmark/Application.java"
        - "src/main/java/com/syntaxtax/benchmark/config/**/*.java"
        - "src/main/java/com/syntaxtax/benchmark/users/UserController.java"
        - "src/main/java/com/syntaxtax/benchmark/products/ProductController.java"
        - "src/main/java/com/syntaxtax/benchmark/orders/OrderController.java"
        - "src/main/java/com/syntaxtax/benchmark/orders/OrderService.java"
      persistence:
        - "src/main/java/com/syntaxtax/benchmark/**/*Repository.java"
        - "src/main/resources/schema.sql"
    operational_extras:
      config:
        - "pom.xml"
        - "src/main/resources/application.properties"
      migrations: []

  laravel:
    metadata:
      language: "php"
      category: "opinionated"
      framework: "laravel"
      orm: "eloquent"
    root_path: "./stacks/opinionated/laravel-app"
    handwritten:
      domain:
        - "app/Models/**/*.php"
      api:
        - "routes/api.php"
        - "app/Http/Controllers/**/*.php"
      persistence:
        - "database/migrations/**/*.php"
    operational_extras:
      config:
        - "composer.json"
        - "composer.lock"
        - "bootstrap/app.php"
        - "config/**/*.php"
      migrations: []

  sinatra:
    metadata:
      language: "ruby"
      category: "api_first"
      framework: "sinatra"
      orm: "activerecord"
    root_path: "./stacks/api-first/sinatra-app"
    handwritten:
      domain:
        - "models/**/*.rb"
      api:
        - "app.rb"
      persistence:
        - "database.rb"
        - "db/migrate/**/*.rb"
    operational_extras:
      config:
        - "Gemfile"
        - "config.ru"
      migrations: []

  express:
    metadata:
      language: "javascript"
      category: "api_first"
      framework: "express"
      orm: "prisma"
    root_path: "./stacks/api-first/express-app"
    handwritten:
      domain:
        - "src/schemas/**/*.js"
        - "prisma/schema.prisma"
      api:
        - "src/app.js"
        - "src/routes/**/*.js"
        - "src/controllers/**/*.js"
        - "src/serializers/**/*.js"
      persistence:
        - "src/db/**/*.js"
        - "prisma/migrations/**/*"
    operational_extras:
      config:
        - "package.json"
      migrations: []

  gin:
    metadata:
      language: "go"
      category: "api_first"
      framework: "gin"
      orm: "gorm"
    root_path: "./stacks/api-first/gin-app"
    handwritten:
      domain:
        - "models/**/*.go"
        - "schemas/**/*.go"
      api:
        - "handlers/**/*.go"
        - "main.go"
      persistence:
        - "db/**/*.go"
        - "db/migrations/**/*.sql"
    operational_extras:
      config:
        - "go.mod"
        - "go.sum"
      migrations: []

  slim:
    metadata:
      language: "php"
      category: "api_first"
      framework: "slim"
      orm: "pdo_sqlite"
    root_path: "./stacks/api-first/slim-app"
    handwritten:
      domain: []
      api:
        - "public/index.php"
        - "config/*.php"
        - "src/Handlers/**/*.php"
      persistence:
        - "src/Db/**/*.php"
        - "database/migrations/**/*.sql"
    operational_extras:
      config:
        - "composer.json"
        - "composer.lock"
      migrations: []
