<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyntaxTax Benchmark Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
            mono: ["IBM Plex Mono", "monospace"],
          },
          colors: {
            sand: "#f7f3ea",
            ink: "#0e1a1f",
            aqua: "#a7f3d0",
            mint: "#d1fae5",
            ember: "#fb923c",
            slateblue: "#1f3b4d",
          },
          boxShadow: {
            panel: "0 24px 80px rgba(14, 26, 31, 0.08)",
          },
        },
      },
    };
  </script>
  <script
    data-goatcounter="https://felipemrvieira.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js"></script>
</head>

<body class="min-h-screen bg-sand font-sans text-ink">
  <div
    class="absolute inset-x-0 top-0 -z-10 h-[32rem] bg-[radial-gradient(circle_at_top_left,_rgba(167,243,208,0.55),_transparent_42%),radial-gradient(circle_at_top_right,_rgba(251,146,60,0.18),_transparent_32%),linear-gradient(180deg,_#fffdf8_0%,_#f7f3ea_72%)]">
  </div>

  <!-- Tab navigation -->
  <nav class="sticky top-0 z-20 border-b border-black/5 bg-white/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center gap-1 px-4 py-2 sm:px-6 lg:px-8">
      <button type="button"
        class="tab-btn inline-flex items-center gap-1.5 rounded-full px-2.5 py-2 sm:px-4 font-mono text-xs uppercase tracking-[0.18em] transition"
        data-tab="dashboard">
        <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span id="nav-dashboard-label" class="hidden sm:inline"></span>
      </button>
      <button type="button"
        class="tab-btn inline-flex items-center gap-1.5 rounded-full px-2.5 py-2 sm:px-4 font-mono text-xs uppercase tracking-[0.18em] transition"
        data-tab="about">
        <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
          aria-hidden="true">
          <path
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span id="nav-about-label" class="hidden sm:inline"></span>
      </button>

      <!-- Author tab + locale switcher — pushed to the right -->
      <div class="ml-auto flex items-center gap-2">
        <!-- Locale switcher -->
        <div class="inline-flex items-center gap-1 rounded-full border border-black/8 bg-sand/60 p-1">
          <button type="button"
            class="locale-toggle inline-flex items-center gap-1.5 rounded-full px-2 py-1 sm:px-2.5 font-mono text-[10px] uppercase tracking-[0.18em] text-slateblue transition"
            data-locale="en" aria-label="Switch language to English">
            <span class="flex h-4 w-4 items-center overflow-hidden rounded-full border border-black/10">
              <svg viewBox="0 0 60 60" class="h-full w-full" aria-hidden="true">
                <rect width="60" height="60" fill="#b22234"></rect>
                <path d="M0 7h60M0 21h60M0 35h60M0 49h60" stroke="#fff" stroke-width="6"></path>
                <rect width="28" height="28" fill="#3c3b6e"></rect>
              </svg>
            </span>
            <span class="hidden sm:inline">EN</span>
          </button>
          <button type="button"
            class="locale-toggle inline-flex items-center gap-1.5 rounded-full px-2 py-1 sm:px-2.5 font-mono text-[10px] uppercase tracking-[0.18em] text-slateblue transition"
            data-locale="pt-BR" aria-label="Mudar idioma para português">
            <span class="flex h-4 w-4 items-center overflow-hidden rounded-full border border-black/10">
              <svg viewBox="0 0 60 60" class="h-full w-full" aria-hidden="true">
                <rect width="60" height="60" fill="#009c3b"></rect>
                <path d="M30 8 52 30 30 52 8 30Z" fill="#ffdf00"></path>
                <circle cx="30" cy="30" r="10" fill="#002776"></circle>
              </svg>
            </span>
            <span class="hidden sm:inline">PT</span>
          </button>
        </div>
        <!-- Divider -->
        <div class="h-5 w-px bg-black/10"></div>
        <!-- Author tab -->
        <button type="button"
          class="tab-btn inline-flex items-center gap-2 rounded-full px-2.5 py-2 sm:px-4 font-mono text-xs uppercase tracking-[0.18em] transition"
          data-tab="author">
          <img src="https://avatars.githubusercontent.com/u/13780312?v=4" alt="Felipe Maciel"
            class="h-5 w-5 rounded-full ring-1 ring-black/10" />
          <span id="nav-author-label" class="hidden sm:inline"></span>
        </button>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">

    <!-- ── DASHBOARD VIEW ───────────────────────────────────────────── -->
    <div id="view-dashboard">
      <section class="grid gap-8 lg:grid-cols-[1.3fr_0.9fr]">
        <div class="rounded-[2rem] border border-black/5 bg-white/80 p-5 sm:p-8 shadow-panel backdrop-blur">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div
              class="mb-6 inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-3 py-1 font-mono text-xs uppercase tracking-[0.24em] text-slateblue">
              SyntaxTax Benchmark
            </div>
          </div>
          <h1 id="hero-title" class="max-w-4xl text-3xl font-bold tracking-tight sm:text-5xl"></h1>
          <p id="hero-body" class="mt-5 max-w-3xl text-base leading-8 text-slateblue/80 sm:text-lg"></p>
          <div id="snapshot-banner" class="mt-5"></div>
          <div class="mt-8 grid gap-4 sm:grid-cols-3" id="hero-stats"></div>
        </div>

        <div class="rounded-[2rem] border border-black/5 bg-slateblue p-5 sm:p-8 text-white shadow-panel">
          <h2 id="lenses-title" class="text-sm font-mono uppercase tracking-[0.24em] text-white/70"></h2>
          <div class="mt-6 space-y-5">
            <div>
              <h3 id="lens-total-title" class="text-xl font-semibold"></h3>
              <p id="lens-total-body" class="mt-2 text-sm leading-7 text-white/78"></p>
            </div>
            <div>
              <h3 id="lens-handwritten-title" class="text-xl font-semibold"></h3>
              <p id="lens-handwritten-body" class="mt-2 text-sm leading-7 text-white/78"></p>
            </div>
            <div>
              <h3 id="lens-operational-title" class="text-xl font-semibold"></h3>
              <p id="lens-operational-body" class="mt-2 text-sm leading-7 text-white/78"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="mt-8 grid gap-6 lg:grid-cols-4" id="methodology-cards"></section>

      <section class="mt-12">
        <div class="flex items-end justify-between gap-4">
          <div>
            <h2 id="global-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
            <p id="global-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
          </div>
        </div>
        <div class="mt-6 grid gap-6 xl:grid-cols-3" id="global-rankings"></div>
      </section>

      <section class="mt-12">
        <div class="flex items-end justify-between gap-4">
          <div>
            <h2 id="guided-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
            <p id="guided-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
          </div>
        </div>
        <div class="mt-6 grid gap-6 lg:grid-cols-3" id="guided-insights"></div>
      </section>

      <section class="mt-12">
        <div class="flex items-end justify-between gap-4">
          <div>
            <h2 id="category-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
            <p id="category-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
          </div>
        </div>
        <div class="mt-6 space-y-8" id="category-sections"></div>
      </section>

      <section class="mt-12 grid gap-6 lg:grid-cols-[1fr_1.2fr]">
        <div class="rounded-[2rem] border border-black/5 bg-white p-5 sm:p-8 shadow-panel">
          <h2 id="how-title" class="text-2xl font-bold tracking-tight"></h2>
          <div class="mt-5 space-y-4 text-sm leading-7 text-slateblue/85">
            <p id="how-1"></p>
            <p id="how-2"></p>
            <p id="how-3"></p>
            <p id="how-4"></p>
          </div>
        </div>

        <div class="rounded-[2rem] border border-black/5 bg-white p-5 sm:p-8 shadow-panel">
          <h2 id="scope-title" class="text-2xl font-bold tracking-tight"></h2>
          <div class="mt-6 grid gap-6 sm:grid-cols-2">
            <div>
              <h3 id="measures-title" class="font-semibold"></h3>
              <ul id="measures-list" class="mt-3 space-y-2 text-sm leading-7 text-slateblue/85"></ul>
            </div>
            <div>
              <h3 id="not-measures-title" class="font-semibold"></h3>
              <ul id="not-measures-list" class="mt-3 space-y-2 text-sm leading-7 text-slateblue/85"></ul>
            </div>
          </div>
        </div>
      </section>

      <section class="mt-12 rounded-[2rem] border border-black/5 bg-ink p-5 sm:p-8 text-white shadow-panel">
        <div class="grid gap-8 lg:grid-cols-[0.9fr_1.1fr]">
          <div>
            <h2 id="methodology-title" class="text-2xl font-bold tracking-tight"></h2>
            <p id="methodology-body" class="mt-4 text-sm leading-7 text-white/72"></p>
          </div>
          <div class="grid gap-4 sm:grid-cols-2" id="methodology-grid"></div>
        </div>
      </section>
    </div><!-- /view-dashboard -->

    <!-- ── ABOUT VIEW ──────────────────────────────────────────────── -->
    <div id="view-about" class="hidden">

      <!-- Hero -->
      <section class="grid gap-8 lg:grid-cols-[1.3fr_0.9fr]">
        <div class="rounded-[2rem] border border-black/5 bg-white/80 p-5 sm:p-8 shadow-panel backdrop-blur">
          <div
            class="mb-6 inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-3 py-1 font-mono text-xs uppercase tracking-[0.24em] text-slateblue">
            SyntaxTax · Study
          </div>
          <h1 id="about-hero-title" class="max-w-3xl text-3xl font-bold tracking-tight sm:text-5xl"></h1>
          <p id="about-hero-body" class="mt-5 max-w-3xl text-base leading-8 text-slateblue/80 sm:text-lg"></p>
          <blockquote id="about-research-question"
            class="mt-8 rounded-3xl border-l-4 border-aqua bg-sand px-5 py-4 font-mono text-sm leading-7 text-slateblue">
          </blockquote>
        </div>
        <div class="rounded-[2rem] border border-black/5 bg-slateblue p-5 sm:p-8 text-white shadow-panel">
          <h2 id="about-constraints-title" class="text-sm font-mono uppercase tracking-[0.24em] text-white/70"></h2>
          <div id="about-constraints-list" class="mt-6 space-y-4 text-sm leading-7"></div>
        </div>
      </section>

      <!-- Why it matters -->
      <section class="mt-8">
        <div class="rounded-[2rem] border border-black/5 bg-aqua/20 p-5 sm:p-8 shadow-panel">
          <p id="about-why-label" class="font-mono text-xs uppercase tracking-[0.22em] text-slateblue/60"></p>
          <p id="about-why-body" class="mt-3 text-base leading-8 text-slateblue/90 max-w-4xl"></p>
        </div>
      </section>

      <!-- Domain -->
      <section class="mt-12">
        <h2 id="about-domain-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
        <p id="about-domain-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
        <div class="mt-6 grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
          <div class="rounded-[2rem] border border-black/5 bg-white p-8 shadow-panel">
            <h3 id="about-endpoints-title" class="mb-4 font-mono text-xs uppercase tracking-[0.18em] text-slateblue/60">
            </h3>
            <div id="about-endpoints-list" class="space-y-2"></div>
          </div>
          <div class="rounded-[2rem] border border-black/5 bg-white p-8 shadow-panel">
            <h3 id="about-entities-title" class="mb-4 font-mono text-xs uppercase tracking-[0.18em] text-slateblue/60">
            </h3>
            <div id="about-entities-list" class="space-y-3"></div>
          </div>
        </div>
      </section>

      <!-- Stacks -->
      <section class="mt-12">
        <h2 id="about-stacks-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
        <p id="about-stacks-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
        <div class="mt-6">
          <h3 id="about-apifirst-label" class="mb-3 font-mono text-xs uppercase tracking-[0.18em] text-slateblue/60">
          </h3>
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-5" id="about-stacks-apifirst"></div>
        </div>
        <div class="mt-6">
          <h3 id="about-opinionated-label" class="mb-3 font-mono text-xs uppercase tracking-[0.18em] text-slateblue/60">
          </h3>
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-5" id="about-stacks-opinionated"></div>
        </div>
      </section>

      <!-- Metrics guide -->
      <section class="mt-12">
        <h2 id="about-metrics-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
        <p id="about-metrics-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
        <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4" id="about-metrics-cards"></div>
      </section>

      <!-- File browser -->
      <section class="mt-12">
        <h2 id="about-browser-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
        <p id="about-browser-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
        <div class="mt-6 rounded-[2rem] border border-black/5 bg-sand/70 p-5 shadow-sm">
          <h3 id="about-classification-notes-title" class="text-lg font-semibold tracking-tight"></h3>
          <p id="about-classification-notes-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
          <ul id="about-classification-notes-list" class="mt-4 grid gap-3 lg:grid-cols-3"></ul>
        </div>
        <div class="mt-6 rounded-[2rem] border border-black/5 bg-white p-2 shadow-panel" id="about-file-browser">
          <div id="about-browser-group-apifirst"></div>
          <div id="about-browser-group-opinionated" class="mt-1"></div>
        </div>
      </section>

      <!-- Glossary -->
      <section class="mt-12">
        <h2 id="about-glossary-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
        <p id="about-glossary-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
        <div id="about-glossary-list" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      </section>

      <!-- Repo link -->
      <section class="mt-12 flex justify-center">
        <a href="https://github.com/felipemrvieira/SyntaxTax" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-5 py-2.5 font-mono text-xs uppercase tracking-[0.18em] text-slateblue shadow-sm transition hover:bg-sand">
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844a9.57 9.57 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
          github.com/felipemrvieira/SyntaxTax
        </a>
      </section>

    </div><!-- /view-about -->

    <!-- ── AUTHOR VIEW ──────────────────────────────────────────────── -->
    <div id="view-author" class="hidden">

      <!-- Identity -->
      <section class="grid gap-8 lg:grid-cols-[0.65fr_1.35fr]">
        <!-- Left card: avatar + links -->
        <div
          class="flex flex-col items-center rounded-[2rem] border border-black/5 bg-slateblue p-8 text-center text-white shadow-panel">
          <img src="https://avatars.githubusercontent.com/u/13780312?v=4" alt="Felipe Maciel Ramos Vieira"
            class="h-28 w-28 rounded-full ring-4 ring-white/20" />
          <h1 id="author-name" class="mt-5 text-xl font-bold leading-tight"></h1>
          <p id="author-handle" class="mt-1 font-mono text-xs text-white/50"></p>
          <p id="author-location" class="mt-4 font-mono text-xs text-white/60"></p>
          <div id="author-links" class="mt-8 flex w-full flex-col gap-3"></div>
        </div>
        <!-- Right card: bio -->
        <div class="rounded-[2rem] border border-black/5 bg-white/80 p-8 shadow-panel backdrop-blur">
          <div
            class="mb-6 inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-3 py-1 font-mono text-xs uppercase tracking-[0.24em] text-slateblue">
            SyntaxTax · Author
          </div>
          <h2 id="author-bio-title" class="text-3xl font-bold tracking-tight sm:text-4xl"></h2>
          <p id="author-bio-body" class="mt-5 text-sm leading-7 text-slateblue/80"></p>
          <div id="author-tags" class="mt-6 flex flex-wrap gap-2"></div>
        </div>
      </section>

      <!-- Contact -->
      <section class="mt-12">
        <h2 id="author-contact-title" class="text-2xl font-bold tracking-tight sm:text-3xl"></h2>
        <p id="author-contact-body" class="mt-2 max-w-3xl text-sm leading-7 text-slateblue/80"></p>
        <div id="author-contact-cards" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      </section>

    </div><!-- /view-author -->

  </main>

  <!-- Share modal -->
  <div id="share-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center p-4" role="dialog"
    aria-modal="true" aria-labelledby="share-modal-title" style="display:none">
    <div id="share-modal-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative z-10 w-full max-w-sm rounded-[2rem] bg-white p-6 shadow-2xl">
      <!-- Header -->
      <div class="flex items-center justify-between mb-5">
        <h2 id="share-modal-title" class="font-bold text-lg text-ink"></h2>
        <button id="share-modal-close" type="button"
          class="flex h-8 w-8 items-center justify-center rounded-full border border-black/8 bg-sand transition hover:bg-sand/70"
          aria-label="Close">
          <svg class="h-3.5 w-3.5 text-slateblue/70" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <!-- Preview -->
      <img id="share-modal-preview"
        class="w-full rounded-2xl border border-black/5 mb-5 max-h-64 object-contain bg-sand/30" alt="" />
      <!-- Actions -->
      <div id="share-modal-actions" class="space-y-2"></div>
    </div>
  </div>

  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./app.js"></script>
</body>

</html>
